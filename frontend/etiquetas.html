<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2128">
<title>Imprimir Etiquetas — Arquivo Morto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased selection:bg-brand-100">
<div id="layout-shell"></div>

<template id="tpl-content">
  <div class="mx-auto max-w-6xl">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-4 print:hidden">
      <div>
        <p class="mb-1 text-xs font-bold uppercase tracking-[0.2em] text-brand-600">Identificação</p>
        <h2 class="text-2xl font-bold tracking-tight text-slate-950 md:text-3xl">Imprimir etiquetas</h2>
        <p class="mt-1 text-sm text-slate-500">Monte um layout de impressão com QR Code e localização.</p>
      </div>
      <button id="btn-imprimir" class="rounded-xl bg-brand-400 px-4 py-2.5 text-sm font-bold text-slate-950 shadow-glow transition hover:-translate-y-0.5 hover:bg-brand-500 active:scale-95">Imprimir selecionadas</button>
    </div>

    <div class="mb-6 rounded-2xl border border-slate-200/80 bg-white p-5 shadow-soft print:hidden">
      <label for="busca-etiqueta" class="mb-2 block text-xs font-semibold text-slate-500">Selecionar produtos</label>
      <input id="busca-etiqueta" placeholder="Buscar por nome ou código…" class="mb-3 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100">
      <div id="lista-selecao" class="flex max-h-80 flex-col gap-1 overflow-y-auto pr-1"></div>
    </div>

    <div id="area-impressao" class="flex flex-wrap justify-start gap-4 print:absolute print:left-0 print:top-0 print:w-full print:gap-2"></div>
  </div>
</template>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="/vendor/qrcode.min.js"></script>
<script src="js/etiquetas.js"></script>
</body>
</html>
