<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escanear QR Code — Arquivo Morto</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2128">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased selection:bg-brand-100">
<div id="layout-shell"></div>

<template id="tpl-content">
  <div class="mx-auto max-w-lg">
    <div class="mb-6 text-center">
      <p class="mb-1 text-xs font-bold uppercase tracking-[0.2em] text-brand-600">Operação mobile</p>
      <h2 class="text-2xl font-bold tracking-tight text-slate-950">Escanear QR Code</h2>
      <p class="mt-1 text-sm text-slate-500">Centralize a etiqueta para localizar o item.</p>
    </div>

    <!-- Etapa 1: câmera -->
    <div id="etapa-scanner">
      <div id="scanner-status" role="status" aria-live="polite" class="mb-3 rounded-2xl border border-slate-200 bg-white p-3 text-sm text-slate-600 shadow-soft">
        Preparando a câmera…
      </div>
      <div id="reader" class="min-h-[280px] w-full overflow-hidden rounded-3xl border-4 border-slate-900 bg-slate-950 shadow-2xl [&_canvas]:max-w-full [&_img]:max-w-full [&_video]:max-w-full"></div>
      <div id="controles-camera" class="hidden mt-3">
        <label for="select-camera" class="text-xs font-semibold text-slate-500">Câmera</label>
        <select id="select-camera" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100"></select>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <button type="button" id="btn-reiniciar-scanner" class="rounded-xl bg-slate-950 px-3 py-2.5 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-800 active:scale-95 disabled:opacity-50">Reiniciar câmera</button>
        <label class="cursor-pointer rounded-xl bg-slate-950 px-3 py-2.5 text-center text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-800 active:scale-95">
          Ler uma imagem
          <input id="input-qr-imagem" type="file" accept="image/*" capture="environment" class="hidden">
        </label>
      </div>
      <div class="mt-4 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-soft">
        <p class="mb-2 text-xs font-semibold text-slate-500">Ou digite o código manualmente</p>
        <form id="form-codigo-manual" class="flex gap-2">
          <input id="codigo-manual" maxlength="12" pattern="\d{3}\.\d{3}\.\d{4}" placeholder="000.000.0000" class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 font-mono text-sm outline-none focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100">
          <button class="rounded-xl bg-brand-400 px-4 py-2.5 text-sm font-bold text-slate-950 transition hover:bg-brand-500 active:scale-95">Buscar</button>
        </form>
      </div>
    </div>

    <!-- Etapa 2: produto encontrado + formulário -->
    <div id="etapa-produto" class="hidden">
      <div class="mb-4 animate-pop rounded-2xl border border-slate-200/80 bg-white p-5 shadow-soft">
        <div class="flex items-center justify-between mb-1">
          <span class="inline-flex rotate-[-0.6deg] rounded-md border-2 border-slate-900 px-2.5 py-1 font-mono text-xs font-bold tracking-[0.14em]" id="prod-codigo"></span>
          <button id="btn-escanear-outro" class="rounded-lg px-2 py-1 text-xs font-semibold text-slate-500 transition hover:bg-slate-100 hover:text-slate-900">Escanear outro</button>
        </div>
        <h3 id="prod-nome" class="mt-3 text-xl font-bold text-slate-950"></h3>
        <p class="text-sm text-slate-500" id="prod-localizacao"></p>
        <p class="mt-3 inline-flex rounded-lg bg-slate-100 px-3 py-1.5 text-sm">Saldo atual: <span id="prod-saldo" class="ml-1 font-bold text-slate-950"></span></p>
      </div>

      <div class="flex gap-2 mb-4">
        <button id="btn-modo-entrada" class="flex-1 rounded-xl border-2 border-emerald-500 bg-emerald-50 py-2.5 text-sm font-bold text-emerald-700 transition hover:-translate-y-0.5 hover:bg-emerald-100">↓ Entrada</button>
        <button id="btn-modo-saida" class="flex-1 rounded-xl border-2 border-red-500 bg-red-50 py-2.5 text-sm font-bold text-red-700 transition hover:-translate-y-0.5 hover:bg-red-100">↑ Saída</button>
      </div>

      <!-- Formulário de ENTRADA -->
      <form id="form-entrada" class="hidden flex animate-pop flex-col gap-3 rounded-2xl border border-emerald-200 bg-white p-5 shadow-soft">
        <h4 class="font-bold text-emerald-700">Confirmar entrada</h4>
        <div>
          <label class="mb-1 block text-xs font-semibold text-slate-500">Quantidade adicionada</label>
          <input required type="number" min="1" step="1" id="entrada-quantidade" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-slate-500">Responsável</label>
          <input required id="entrada-responsavel" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100" placeholder="Seu nome">
        </div>
        <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-3 text-sm font-bold text-white transition hover:-translate-y-0.5 hover:bg-emerald-700 active:scale-95 disabled:opacity-50">Confirmar entrada</button>
      </form>

      <!-- Formulário de SAÍDA -->
      <form id="form-saida" class="hidden flex animate-pop flex-col gap-3 rounded-2xl border border-red-200 bg-white p-5 shadow-soft">
        <h4 class="font-bold text-red-700">Confirmar retirada</h4>
        <div>
          <label class="mb-1 block text-xs font-semibold text-slate-500">Quantidade retirada</label>
          <input required type="number" min="1" step="1" id="saida-quantidade" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-red-400 focus:ring-4 focus:ring-red-100">
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-slate-500">Motivo da retirada</label>
          <input required id="saida-motivo" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-red-400 focus:ring-4 focus:ring-red-100" placeholder="Ex: uso em auditoria">
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-slate-500">Solicitante/Responsável</label>
          <input required id="saida-responsavel" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-red-400 focus:ring-4 focus:ring-red-100" placeholder="Seu nome">
        </div>
        <button type="submit" class="rounded-xl bg-red-600 px-4 py-3 text-sm font-bold text-white transition hover:-translate-y-0.5 hover:bg-red-700 active:scale-95 disabled:opacity-50">Confirmar retirada</button>
      </form>
    </div>

    <!-- Etapa 3: confirmação -->
    <div id="etapa-sucesso" class="hidden animate-pop rounded-3xl border border-emerald-200 bg-white p-7 text-center shadow-soft">
      <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-full bg-emerald-100 text-2xl text-emerald-700">✓</div>
      <h3 class="text-xl font-bold text-slate-950" id="sucesso-titulo"></h3>
      <p class="mt-1 text-sm text-slate-500" id="sucesso-detalhe"></p>
      <button id="btn-nova-leitura" class="mt-5 w-full rounded-xl bg-slate-950 px-4 py-3 text-sm font-bold text-white transition hover:bg-slate-800 active:scale-95">Nova leitura</button>
    </div>
  </div>
</template>

<script src="/vendor/html5-qrcode.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/scanner.js"></script>
</body>
</html>
