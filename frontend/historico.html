<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2128">
<title>Histórico — Arquivo Morto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased selection:bg-brand-100">
<div id="layout-shell"></div>

<template id="tpl-content">
  <div class="mx-auto max-w-7xl">
    <p class="mb-1 text-xs font-bold uppercase tracking-[0.2em] text-brand-600">Auditoria</p>
    <h2 class="text-2xl font-bold tracking-tight text-slate-950 md:text-3xl">Histórico de movimentações</h2>
    <p class="mb-8 mt-1 text-sm text-slate-500">Consulte todas as entradas e saídas registradas no arquivo morto.</p>

    <div class="mb-6 flex flex-wrap items-end gap-3 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-soft md:p-5">
      <div class="flex-1 min-w-[160px]">
        <label class="mb-1.5 block text-xs font-semibold text-slate-500">Código</label>
        <input id="filtro-codigo" placeholder="001.001.0042" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 font-mono text-sm outline-none focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100">
      </div>
      <div class="flex-1 min-w-[160px]">
        <label class="mb-1.5 block text-xs font-semibold text-slate-500">Nome do produto</label>
        <input id="filtro-nome" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100">
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-500">Família</label>
        <select id="filtro-familia" class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100"><option value="">Todas</option></select>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-500">Tipo de produto</label>
        <select id="filtro-tipo" class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100"><option value="">Todos</option></select>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-500">Movimento</label>
        <select id="filtro-movimento" class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100">
          <option value="">Entradas e saídas</option>
          <option value="entrada">Só entradas</option>
          <option value="saida">Só saídas</option>
        </select>
      </div>
      <button id="btn-filtrar-historico" class="rounded-xl bg-slate-950 px-4 py-2.5 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-800 active:scale-95">Filtrar</button>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-slate-200/80 bg-white p-4 shadow-soft md:p-6">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-100 text-left text-[11px] font-bold uppercase tracking-wider text-slate-400">
            <th class="py-2 pr-3">Data/Hora</th>
            <th class="py-2 pr-3">Tipo</th>
            <th class="py-2 pr-3">Código</th>
            <th class="py-2 pr-3">Produto</th>
            <th class="py-2 pr-3">Qtd.</th>
            <th class="py-2 pr-3">Saldo (antes → depois)</th>
            <th class="py-2 pr-3">Responsável</th>
            <th class="py-2 pr-3">Motivo</th>
          </tr>
        </thead>
        <tbody id="tabela-historico"></tbody>
      </table>
      <p id="msg-vazio-historico" class="hidden py-12 text-center text-sm text-slate-400">Nenhuma movimentação encontrada.</p>
    </div>
  </div>
</template>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/historico.js"></script>
</body>
</html>
